<!doctype html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINI GAME ARCADE</title><style>
  * { box-sizing: border-box; }
  :root{
    --bg:#0b1020; --panel:#151d33; --panel2:#1e2947; --text:#f6f8ff;
    --muted:#aab4d6; --accent:#7c5cff; --accent2:#26d0ce; --danger:#ff5d73;
  }
  body{
    margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--text);
    background:radial-gradient(circle at top, #1a2450 0, var(--bg) 48%);
    min-height:100vh;
  }
  button{font:inherit}
  .wrap{max-width:1100px;margin:auto;padding:34px 18px 60px}
  header{text-align:center;margin-bottom:30px}
  h1{font-size:clamp(34px,7vw,64px);margin:0 0 8px;letter-spacing:-2px}
  header p{margin:0;color:var(--muted);font-size:17px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
  .card{
    border:1px solid #334269; background:linear-gradient(145deg,var(--panel2),var(--panel));
    border-radius:22px;padding:24px;min-height:190px;cursor:pointer;
    transition:.2s transform,.2s border-color,.2s box-shadow;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .card:hover{transform:translateY(-5px);border-color:#7f8cff;box-shadow:0 18px 40px #0005}
  .emoji{font-size:46px}.card h2{margin:12px 0 8px}.card p{margin:0;color:var(--muted);line-height:1.55}
  .tag{display:inline-block;margin-top:14px;color:#fff;background:#ffffff12;border:1px solid #ffffff1d;padding:7px 10px;border-radius:999px;font-size:13px}
  .game{
    display:none; position:fixed; inset:0; z-index:10; overflow:auto;
    background:rgba(5,8,18,.96); padding:20px;
  }
  .game.active{display:block}
  .gamebox{max-width:900px;margin:20px auto;background:#121a2f;border:1px solid #334269;border-radius:24px;padding:24px;min-height:620px}
  .topbar{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap}
  .topbar h2{margin:0}
  .btn{border:0;border-radius:12px;padding:11px 16px;background:var(--accent);color:white;cursor:pointer;font-weight:700}
  .btn.secondary{background:#2c385d}.btn.danger{background:var(--danger)}
  .score{background:#0c1325;border-radius:12px;padding:10px 14px;color:#dce3ff}
  canvas{display:block;max-width:100%;margin:0 auto;background:#080d18;border-radius:16px;border:1px solid #2b3554}
  .center{text-align:center}
  .big{font-size:44px;font-weight:800}
  .hint{color:var(--muted);margin:10px 0 18px}
  .reaction-area{
    height:360px;border-radius:20px;background:#26314f;display:flex;align-items:center;justify-content:center;
    font-size:30px;font-weight:800;user-select:none;cursor:pointer;text-align:center;padding:30px;
  }
  .reaction-area.ready{background:#22a06b}.reaction-area.too-soon{background:#b54747}
  .memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:560px;margin:20px auto}
  .mem-card{aspect-ratio:1;border:0;border-radius:16px;background:#2a365b;color:transparent;font-size:38px;cursor:pointer}
  .mem-card.open,.mem-card.matched{background:#f3f5ff;color:#111}
  .target-area{position:relative;height:430px;background:#080d18;border:1px solid #2b3554;border-radius:16px;overflow:hidden}
  .target{position:absolute;width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#ffdf4d,#ff6b5c);cursor:pointer;box-shadow:0 0 0 8px #ffffff15}
  .rps-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:26px 0}
  .rps{font-size:56px;width:110px;height:110px;border-radius:20px;border:1px solid #44547f;background:#202b49;cursor:pointer}
  .rps-result{min-height:92px;font-size:24px;font-weight:700}
  .guess-input{width:180px;max-width:80%;padding:16px;border-radius:14px;border:1px solid #43517a;background:#0d1427;color:white;font-size:24px;text-align:center}
  .guess-log{max-width:430px;margin:22px auto;color:#dbe2ff;line-height:1.8}
  @media(max-width:600px){.gamebox{padding:16px;min-height:90vh}.memory-grid{gap:8px}.rps{width:86px;height:86px;font-size:44px}}
.card{text-decoration:none;color:inherit}</style>
</head><body><div class="wrap"><header><h1>🎮 MINI GAME ARCADE</h1>
<p>원하는 게임을 클릭해서 바로 플레이하세요.</p></header>
<div class="grid"><a class="card" href="snake.html"><div><div class="emoji">🐍</div><h2>스네이크</h2><p>방향키로 뱀을 움직여 먹이를 먹으세요.</p></div><span class="tag">키보드</span></a><a class="card" href="reaction.html"><div><div class="emoji">⚡</div><h2>반응속도 테스트</h2><p>초록색이 되는 순간 클릭하세요.</p></div><span class="tag">마우스</span></a><a class="card" href="memory.html"><div><div class="emoji">🧠</div><h2>카드 짝맞추기</h2><p>같은 그림의 카드 짝을 찾아보세요.</p></div><span class="tag">기억력</span></a><a class="card" href="target.html"><div><div class="emoji">🎯</div><h2>타겟 클릭</h2><p>30초 동안 타겟을 최대한 많이 클릭하세요.</p></div><span class="tag">스피드</span></a><a class="card" href="rps.html"><div><div class="emoji">✊</div><h2>가위바위보</h2><p>컴퓨터와 10판 승부하세요.</p></div><span class="tag">운 + 심리전</span></a><a class="card" href="guess.html"><div><div class="emoji">🔢</div><h2>숫자 맞추기</h2><p>1~100 사이의 숨겨진 숫자를 맞혀보세요.</p></div><span class="tag">추리</span></a></div></div></body></html>
