<!doctype html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스네이크</title><style>
  * { box-sizing: border-box; }
  :root{
    --bg:#0b1020; --panel:#151d33; --panel2:#1e2947; --text:#f6f8ff;
    --muted:#aab4d6; --accent:#7c5cff; --accent2:#26d0ce; --danger:#ff5d73;
  }
  body{
    margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--text);
    background:radial-gradient(circle at top, #1a2450 0, var(--bg) 48%);
    min-height:100vh;
  }
  button{font:inherit}
  .wrap{max-width:1100px;margin:auto;padding:34px 18px 60px}
  header{text-align:center;margin-bottom:30px}
  h1{font-size:clamp(34px,7vw,64px);margin:0 0 8px;letter-spacing:-2px}
  header p{margin:0;color:var(--muted);font-size:17px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
  .card{
    border:1px solid #334269; background:linear-gradient(145deg,var(--panel2),var(--panel));
    border-radius:22px;padding:24px;min-height:190px;cursor:pointer;
    transition:.2s transform,.2s border-color,.2s box-shadow;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .card:hover{transform:translateY(-5px);border-color:#7f8cff;box-shadow:0 18px 40px #0005}
  .emoji{font-size:46px}.card h2{margin:12px 0 8px}.card p{margin:0;color:var(--muted);line-height:1.55}
  .tag{display:inline-block;margin-top:14px;color:#fff;background:#ffffff12;border:1px solid #ffffff1d;padding:7px 10px;border-radius:999px;font-size:13px}
  .game{
    display:none; position:fixed; inset:0; z-index:10; overflow:auto;
    background:rgba(5,8,18,.96); padding:20px;
  }
  .game.active{display:block}
  .gamebox{max-width:900px;margin:20px auto;background:#121a2f;border:1px solid #334269;border-radius:24px;padding:24px;min-height:620px}
  .topbar{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap}
  .topbar h2{margin:0}
  .btn{border:0;border-radius:12px;padding:11px 16px;background:var(--accent);color:white;cursor:pointer;font-weight:700}
  .btn.secondary{background:#2c385d}.btn.danger{background:var(--danger)}
  .score{background:#0c1325;border-radius:12px;padding:10px 14px;color:#dce3ff}
  canvas{display:block;max-width:100%;margin:0 auto;background:#080d18;border-radius:16px;border:1px solid #2b3554}
  .center{text-align:center}
  .big{font-size:44px;font-weight:800}
  .hint{color:var(--muted);margin:10px 0 18px}
  .reaction-area{
    height:360px;border-radius:20px;background:#26314f;display:flex;align-items:center;justify-content:center;
    font-size:30px;font-weight:800;user-select:none;cursor:pointer;text-align:center;padding:30px;
  }
  .reaction-area.ready{background:#22a06b}.reaction-area.too-soon{background:#b54747}
  .memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:560px;margin:20px auto}
  .mem-card{aspect-ratio:1;border:0;border-radius:16px;background:#2a365b;color:transparent;font-size:38px;cursor:pointer}
  .mem-card.open,.mem-card.matched{background:#f3f5ff;color:#111}
  .target-area{position:relative;height:430px;background:#080d18;border:1px solid #2b3554;border-radius:16px;overflow:hidden}
  .target{position:absolute;width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#ffdf4d,#ff6b5c);cursor:pointer;box-shadow:0 0 0 8px #ffffff15}
  .rps-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:26px 0}
  .rps{font-size:56px;width:110px;height:110px;border-radius:20px;border:1px solid #44547f;background:#202b49;cursor:pointer}
  .rps-result{min-height:92px;font-size:24px;font-weight:700}
  .guess-input{width:180px;max-width:80%;padding:16px;border-radius:14px;border:1px solid #43517a;background:#0d1427;color:white;font-size:24px;text-align:center}
  .guess-log{max-width:430px;margin:22px auto;color:#dbe2ff;line-height:1.8}
  @media(max-width:600px){.gamebox{padding:16px;min-height:90vh}.memory-grid{gap:8px}.rps{width:86px;height:86px;font-size:44px}}

body{overflow:auto} .game{position:static;display:block;min-height:100vh;background:transparent}
</style></head><body><section class="game active" id="snake">
  <div class="gamebox">
    <div class="topbar"><h2>🐍 스네이크</h2><div><span class="score">점수 <b id="snakeScore">0</b></span> <button class="btn secondary" onclick="resetSnake()">다시 시작</button> <button class="btn danger" onclick="location.href='index.html'">나가기</button></div></div>
    <p class="hint center">방향키 ↑ ↓ ← → 로 움직이세요.</p>
    <canvas id="snakeCanvas" width="600" height="600"></canvas>
  </div>
</section><script>
function openGame(id){ document.getElementById(id).classList.add('active'); document.body.style.overflow='hidden'; if(id==='snake') resetSnake(); if(id==='memory') initMemory(); if(id==='guess') resetGuess(); }
function closeGame(id){ document.getElementById(id).classList.remove('active'); document.body.style.overflow=''; if(id==='snake') clearInterval(snakeTimer); if(id==='target') stopTarget(); }

// Snake
const sc=document.getElementById('snakeCanvas'), sx=sc.getContext('2d');
let snake=[], food={}, dir={x:1,y:0}, nextDir={x:1,y:0}, snakeTimer=null, snakeScore=0;
const cell=20, cols=sc.width/cell;
function resetSnake(){
  clearInterval(snakeTimer); snake=[{x:10,y:15},{x:9,y:15},{x:8,y:15}]; dir={x:1,y:0}; nextDir={x:1,y:0}; snakeScore=0; document.getElementById('snakeScore').textContent=0; spawnFood(); drawSnake(); snakeTimer=setInterval(stepSnake,95);
}
function spawnFood(){ do{food={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*cols)}}while(snake.some(s=>s.x===food.x&&s.y===food.y));}
function stepSnake(){
  dir=nextDir; let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=cols||h.y>=cols||snake.some(s=>s.x===h.x&&s.y===h.y)){clearInterval(snakeTimer); drawSnake(true); return;}
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){snakeScore++;document.getElementById('snakeScore').textContent=snakeScore;spawnFood();}else snake.pop();
  drawSnake();
}
function drawSnake(gameover=false){
  sx.fillStyle='#080d18';sx.fillRect(0,0,sc.width,sc.height);
  sx.fillStyle='#ff5d73';sx.beginPath();sx.arc(food.x*cell+cell/2,food.y*cell+cell/2,cell*.36,0,Math.PI*2);sx.fill();
  snake.forEach((s,i)=>{sx.fillStyle=i===0?'#7c5cff':'#26d0ce';sx.fillRect(s.x*cell+2,s.y*cell+2,cell-4,cell-4)});
  if(gameover){sx.fillStyle='#000a';sx.fillRect(0,0,sc.width,sc.height);sx.fillStyle='white';sx.textAlign='center';sx.font='bold 42px Arial';sx.fillText('GAME OVER',sc.width/2,sc.height/2);sx.font='22px Arial';sx.fillText('다시 시작 버튼을 눌러주세요',sc.width/2,sc.height/2+42);}
}
document.addEventListener('keydown',e=>{
 if(!document.getElementById('snake').classList.contains('active')) return;
 const m={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};
 if(m[e.key] && !(m[e.key].x===-dir.x&&m[e.key].y===-dir.y)){ nextDir=m[e.key]; e.preventDefault(); }
});

// Reaction
let reactionState='idle', reactionTimer=null, reactionStart=0, best=null;
function startReaction(){
 clearTimeout(reactionTimer); reactionState='waiting'; const a=document.getElementById('reactionArea'); a.className='reaction-area'; a.textContent='기다리세요...';
 reactionTimer=setTimeout(()=>{reactionState='ready';reactionStart=performance.now();a.className='reaction-area ready';a.textContent='지금 클릭!';}, 1200+Math.random()*2800);
}
function reactionClick(){
 const a=document.getElementById('reactionArea');
 if(reactionState==='waiting'){clearTimeout(reactionTimer);reactionState='idle';a.className='reaction-area too-soon';a.textContent='너무 빨랐어요! 다시 시작하세요.';}
 else if(reactionState==='ready'){let ms=Math.round(performance.now()-reactionStart);reactionState='idle';a.className='reaction-area';a.textContent=ms+' ms';if(best===null||ms<best)best=ms;document.getElementById('reactionBest').textContent='최고기록: '+best+' ms';}
}

// Memory
let memFirst=null, memSecond=null, memLock=false, memMoves=0, memMatched=0;
const icons=['🍎','🍋','🍇','🍉','🍒','🥝','🍑','🍓'];
function initMemory(){
 let arr=[...icons,...icons].sort(()=>Math.random()-.5); let g=document.getElementById('memoryGrid');g.innerHTML='';memFirst=memSecond=null;memLock=false;memMoves=0;memMatched=0;document.getElementById('memoryMoves').textContent=0;document.getElementById('memoryMsg').textContent='같은 그림 2장을 찾아보세요.';
 arr.forEach((ic,i)=>{let b=document.createElement('button');b.className='mem-card';b.textContent=ic;b.dataset.icon=ic;b.onclick=()=>flipMem(b);g.appendChild(b);});
}
function flipMem(b){
 if(memLock||b.classList.contains('open')||b.classList.contains('matched'))return;b.classList.add('open');
 if(!memFirst){memFirst=b;return;} memSecond=b;memMoves++;document.getElementById('memoryMoves').textContent=memMoves;
 if(memFirst.dataset.icon===memSecond.dataset.icon){memFirst.classList.add('matched');memSecond.classList.add('matched');memMatched+=2;memFirst=memSecond=null;if(memMatched===16)document.getElementById('memoryMsg').textContent='🎉 성공! '+memMoves+'번 만에 완료했습니다.';}
 else{memLock=true;setTimeout(()=>{memFirst.classList.remove('open');memSecond.classList.remove('open');memFirst=memSecond=null;memLock=false;},700);}
}

// Target
let targetScore=0,targetSeconds=30,targetTimer=null,targetRunning=false;
function startTarget(){stopTarget();targetScore=0;targetSeconds=30;targetRunning=true;document.getElementById('targetScore').textContent=0;document.getElementById('targetTime').textContent=30;spawnTarget();targetTimer=setInterval(()=>{targetSeconds--;document.getElementById('targetTime').textContent=targetSeconds;if(targetSeconds<=0){stopTarget();alert('게임 종료! 점수: '+targetScore);}},1000);}
function spawnTarget(){if(!targetRunning)return;let area=document.getElementById('targetArea');area.innerHTML='';let t=document.createElement('div');t.className='target';let maxX=Math.max(0,area.clientWidth-64),maxY=Math.max(0,area.clientHeight-64);t.style.left=Math.random()*maxX+'px';t.style.top=Math.random()*maxY+'px';t.onclick=()=>{targetScore++;document.getElementById('targetScore').textContent=targetScore;spawnTarget();};area.appendChild(t);}
function stopTarget(){targetRunning=false;clearInterval(targetTimer);let a=document.getElementById('targetArea');if(a)a.innerHTML='';}

// RPS
let rpsMe=0,rpsCpu=0,rpsRound=0;
const rpsNames=['가위 ✌️','바위 ✊','보 ✋'];
function resetRps(){rpsMe=rpsCpu=rpsRound=0;updateRps();document.getElementById('rpsResult').textContent='선택하세요!';}
function updateRps(){document.getElementById('rpsMe').textContent=rpsMe;document.getElementById('rpsCpu').textContent=rpsCpu;document.getElementById('rpsRound').textContent=rpsRound;}
function playRps(me){
 if(rpsRound>=10)return;let cpu=Math.floor(Math.random()*3);rpsRound++;let result='';
 if(me===cpu) result='무승부!';
 else if((me===0&&cpu===2)||(me===1&&cpu===0)||(me===2&&cpu===1)){rpsMe++;result='승리!';}else{rpsCpu++;result='패배!';}
 updateRps();document.getElementById('rpsResult').textContent='나: '+rpsNames[me]+' / 컴퓨터: '+rpsNames[cpu]+' → '+result;
 if(rpsRound===10)setTimeout(()=>{document.getElementById('rpsResult').textContent += '  |  최종 결과: '+(rpsMe>rpsCpu?'🏆 당신의 승리!':rpsMe<rpsCpu?'💻 컴퓨터 승리!':'🤝 무승부!');},150);
}

// Guess
let answer=0,guessCount=0;
function resetGuess(){answer=Math.floor(Math.random()*100)+1;guessCount=0;document.getElementById('guessLog').innerHTML='새로운 숫자가 정해졌습니다.';document.getElementById('guessInput').value='';}
function submitGuess(){
 let input=document.getElementById('guessInput');let n=Number(input.value);if(!Number.isInteger(n)||n<1||n>100){document.getElementById('guessLog').innerHTML='1~100 사이의 정수를 입력하세요.';return;}
 guessCount++;let msg=n===answer?'🎉 정답! '+guessCount+'번 만에 맞혔습니다.':n<answer?'⬆️ '+n+'보다 큽니다.':'⬇️ '+n+'보다 작습니다.';
 document.getElementById('guessLog').innerHTML=msg+'<br>시도 횟수: '+guessCount;input.value='';input.focus();
}
</script></body></html>
